name: Update sources

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: update-sources
  # Queuing instead of cancelling would let a waiting run check out the
  # pre-push commit and then fail its own push as non-fast-forward. A
  # superseded update run has nothing worth finishing; the next one redoes it.
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - name: Run update script
        id: update
        shell: bash
        # Kept under the job timeout so a hung update trips this step first. A
        # step timeout fails the step, which keeps the notification below
        # firing; a job timeout is a cancel and would pass over it silently.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result=$(nix develop -c just update)
          printf '%s\n' "$result"
          case "$result" in
            changed|unchanged) ;;
            *)
              printf 'unexpected update-script output: %s\n' "$result" >&2
              exit 1
              ;;
          esac
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: Verify flake
        if: steps.update.outputs.result == 'changed'
        shell: bash
        run: nix develop -c just check
      - name: Commit and push
        if: steps.update.outputs.result == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          tag=$(jq -r .tag sources.json)
          # update-sources.ts already restricts tag shape, but re-check here so
          # the commit step stays safe even if sources.json is hand-edited.
          # Bash uses POSIX ERE in [[ =~ ]], so leading-zero rejection is
          # written with `(0|[1-9][0-9]*)` rather than `\d`. mise tags are
          # stable-only CalVer ("vYYYY.M.D"), so no prerelease suffix is
          # accepted here either.
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'refusing tag with unexpected shape: %s\n' "$tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "chore: bump mise to ${tag}"
          git push
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = "update-failed";
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            // Rewriting the issue keeps the notification count at one per
            // outage instead of one per run, and the title carries the streak
            // so the severity still shows up in the issue list.
            const buildTitle = (failures) => `Automated update workflow failed (×${failures})`;

            const buildBody = (failures, firstFailure) => [
              "The scheduled update workflow is failing.",
              "",
              `- First failure: ${firstFailure}`,
              `- Consecutive failures: ${failures}`,
              `- Latest run: ${runUrl}`,
              "",
              "Investigation notes belong in comments; this body is rewritten on every failure.",
              `<!-- failures: ${failures} -->`,
            ].join("\n");

            const { data } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            // listForRepo also returns pull requests, and overwriting a body is
            // destructive in a way that adding a comment was not.
            const existing = data.filter((entry) => !entry.pull_request)[0];

            if (existing) {
              const matched = existing.body?.match(/<!-- failures: (\d+) -->/);
              const parsed = Number.parseInt(matched?.[1] ?? "", 10);
              const failures = Number.isSafeInteger(parsed) && parsed > 0 ? parsed + 1 : 1;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title: buildTitle(failures),
                body: buildBody(failures, existing.created_at),
              });
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title: buildTitle(1),
              body: buildBody(1, new Date().toISOString()),
              labels: [label],
            });
