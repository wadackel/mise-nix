name: Setup Nix
description: Install Nix

# No Nix store cache step here: a partially restored store keeps its database
# intact while dropping paths, so every later `nix develop` dies on the first
# missing one. Cold runs cost about a minute for this repo. See AGENTS.md.
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@v22
      with:
        # v21 changed the default to `true`. Keep upstream Nix behavior.
        determinate: false
